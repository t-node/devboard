name: Docker Scan

on:
  workflow_call:

jobs:
  docker-file-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folders: ["backend", "frontend"]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: ${{ matrix.folders}} Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.folders}}/Dockerfilesfas
