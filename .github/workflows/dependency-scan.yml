#Goal -- I have to ensure the packages & dependencies have been audited for security

name: Dependency Scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.22
          go-version-file: "go.mod"
          cache-dependency-path: go.sum
      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@1.3.0
      - name: GoVulncheck
        run: govulncheck ./...
        working-directory: backend

      - name: Code Checkout
        uses: actions/checkout@v7
      - name: setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run dependency Scan for Node
        run: npm audit
        working-directory: frontend
