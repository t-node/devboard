#Goal to check whether the application code coverage doesn't have security threats
name: Sonar Qube Scan

on:
  workflow_call:

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Check Sonar secrets (safe runtime check)
        # pass the secret into the step environment so we can test its presence at runtime
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Do a non-leaking presence check
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Missing SONAR_TOKEN secret; add it at Settings → Secrets → Actions" >&2
            exit 1
          else
            echo "SONAR_TOKEN is set (ok)"
          fi
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL not set; running against SonarCloud"
          else
            echo "SONAR_HOST_URL provided"
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v1 # pin to stable release
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_HOST_URL }}
